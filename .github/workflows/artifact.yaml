name: Artifact

on:
  push:
    branches:
      - development
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mostafa1006
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t mostafa1006/git-branching-lab:${{ github.sha }} \
            -t mostafa1006/git-branching-lab:latest \
            .

      - name: Push image
        run: |
          docker push mostafa1006/git-branching-lab:${{ github.sha }}
          docker push mostafa1006/git-branching-lab:latest